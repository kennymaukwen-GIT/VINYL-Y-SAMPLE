<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Y — 餐廳環境</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage env-stage">

    <!-- ===== Top Navigation ===== -->
    <nav class="nav">
      <div class="nav-left">
        <a href="index.html" class="logo"><span class="logo-text">Vinyl Y</span></a>
      </div>
      <div class="nav-center">
        <a href="menu.html" class="nav-link">菜單</a>
        <a href="reservation.html" class="nav-link">訂位須知</a>
        <a href="#" class="nav-link">品牌故事</a>
        <a href="restaurant.html" class="nav-link is-current">關於餐廳</a>
      </div>
      <a class="nav-toggle" href="menu.html">菜單</a>
    </nav>

    <!-- ===== Left big image (carousel of 3 interior photos) ===== -->
    <section class="panel env-hero">
      <div class="slides" id="heroSlides">
        <div class="slide is-active" style="background-image:url('images/env-1.jpg')"></div>
        <div class="slide" style="background-image:url('images/env-2.jpg')"></div>
        <div class="slide" style="background-image:url('images/env-3.jpg')"></div>
      </div>

      <button class="arrow arrow-left" id="heroPrev" aria-label="上一張">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="arrow arrow-right" id="heroNext" aria-label="下一張">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="dots" id="heroDots">
        <button class="dot is-active" data-i="0" aria-label="第 1 張"></button>
        <button class="dot" data-i="1" aria-label="第 2 張"></button>
        <button class="dot" data-i="2" aria-label="第 3 張"></button>
      </div>

      <span class="since">© Vinyl Y 實境拍攝</span>
    </section>

    <!-- ===== Right info sidebar ===== -->
    <aside class="env-panel">

      <section class="info-card">
        <span class="info-title">營業時間</span>
        <ul class="info-hours">
          <li class="hours-row"><span class="day">星期日-星期一</span><span class="lead"></span><span class="time">固定店休</span></li>
          <li class="hours-row"><span class="day">星期二</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期三</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期四</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期五</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期六</span><span class="lead"></span><span class="time time-stack">12:00 – 14:30<br>17:30 – 21:00</span></li>
        </ul>
      </section>

      <section class="info-card">
        <div class="info-block">
          <span class="info-title">地址</span>
          <p class="info-text">新竹縣竹北市嘉豐南路一段 78 號</p>
        </div>

        <div class="info-block">
          <span class="info-title">聯絡</span>
          <a class="info-link" href="tel:+886366825 52">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .58 3.6 1 1 0 0 1-.24 1z" fill="currentColor"/></svg>
          03-6682552
        </a>
        <a class="info-link" href="reservation.html">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 9h17M8 3v3M16 3v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          訂位須知
        </a>
        </div>
      </section>

      <div class="env-map">
        <iframe
          src="https://www.google.com/maps?q=Vinyl+Y+新竹縣竹北市嘉豐南路一段78號&z=16&hl=zh-TW&output=embed"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          title="Vinyl Y 地圖"></iframe>
        <a class="map-open" href="https://maps.app.goo.gl/fVpTxWLk5hGFkdnm9" target="_blank" rel="noopener">
          在 Google 地圖開啟
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>

    </aside>

  </main>

  <script>
    // 大圖輪播（三張內部照片）
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('#heroSlides .slide'));
      var dots   = Array.prototype.slice.call(document.querySelectorAll('#heroDots .dot'));
      var i = 0, timer;
      function show(n) {
        i = (n + slides.length) % slides.length;
        slides.forEach(function (s, k) { s.classList.toggle('is-active', k === i); });
        dots.forEach(function (d, k) { d.classList.toggle('is-active', k === i); });
      }
      function restart() { clearInterval(timer); timer = setInterval(function () { show(i + 1); }, 5000); }
      document.getElementById('heroPrev').addEventListener('click', function () { show(i - 1); restart(); });
      document.getElementById('heroNext').addEventListener('click', function () { show(i + 1); restart(); });
      dots.forEach(function (d) {
        d.addEventListener('click', function () { show(parseInt(d.dataset.i, 10)); restart(); });
      });
      restart();
    })();
  </script>
</body>
</html>
