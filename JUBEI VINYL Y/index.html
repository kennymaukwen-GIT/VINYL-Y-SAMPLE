<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Y — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Poppins:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">

    <!-- ===== Top Navigation ===== -->
    <nav class="nav">
      <div class="nav-left">
        <a href="index.html" class="logo"><span class="logo-text">Vinyl Y</span></a>
      </div>
      <div class="nav-center">
        <a href="menu.html" class="nav-link">菜單</a>
        <a href="reservation.html" class="nav-link">訂位須知</a>
        <a href="#" class="nav-link">品牌故事</a>
        <a href="restaurant.html" class="nav-link">關於餐廳</a>
      </div>
      <a class="nav-toggle" href="menu.html">菜單</a>
    </nav>

    <!-- ===== Left big image (single, carousel of 3 photos) ===== -->
    <section class="panel hero">
      <div class="slides" id="heroSlides">
        <div class="slide is-active" style="background-image:url('images/hero-1.jpg')"></div>
        <div class="slide" style="background-image:url('images/hero-2.jpg')"></div>
        <div class="slide" style="background-image:url('images/hero-3.jpg')"></div>
      </div>

      <button class="arrow arrow-left" id="heroPrev" aria-label="上一張">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="arrow arrow-right" id="heroNext" aria-label="下一張">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="dots" id="heroDots">
        <button class="dot is-active" data-i="0" aria-label="第 1 張"></button>
        <button class="dot" data-i="1" aria-label="第 2 張"></button>
        <button class="dot" data-i="2" aria-label="第 3 張"></button>
      </div>

      <span class="since">© Vinyl Y 實境拍攝</span>
    </section>

    <!-- ===== Right sidebar ===== -->
    <aside class="sidebar">

      <a class="media media-about" href="restaurant.html">
        <span class="media-label">關於餐廳
          <svg class="lbl-arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="img img-restaurant" role="img" aria-label="餐廳外觀"></div>
      </a>

      <a class="media media-menu" href="menu.html">
        <span class="media-label">菜單
          <svg class="lbl-arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="img img-menu" role="img" aria-label="義大利麵料理"></div>
      </a>

      <!-- Book a Table：連到訂位須知頁面 -->
      <a class="book-btn" href="reservation.html">
        <span>訂位須知</span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M3.5 9h17M8 3v3M16 3v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </a>

      <div class="hours">
        <span class="hours-title">營業時間</span>
        <ul class="hours-list">
          <li class="hours-row"><span class="day">星期日-星期一</span><span class="lead"></span><span class="time">固定店休</span></li>
          <li class="hours-row"><span class="day">星期二</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期三</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期四</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期五</span><span class="lead"></span><span class="time">17:30 – 21:00</span></li>
          <li class="hours-row"><span class="day">星期六</span><span class="lead"></span><span class="time time-stack">12:00 – 14:30<br>17:30 – 21:00</span></li>
        </ul>
      </div>

    </aside>

  </main>

  <script>
    // 左側大圖輪播（三張餐廳照片）
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('#heroSlides .slide'));
      var dots   = Array.prototype.slice.call(document.querySelectorAll('#heroDots .dot'));
      var i = 0, timer;
      function show(n) {
        i = (n + slides.length) % slides.length;
        slides.forEach(function (s, k) { s.classList.toggle('is-active', k === i); });
        dots.forEach(function (d, k) { d.classList.toggle('is-active', k === i); });
      }
      function restart() { clearInterval(timer); timer = setInterval(function () { show(i + 1); }, 5000); }
      document.getElementById('heroPrev').addEventListener('click', function () { show(i - 1); restart(); });
      document.getElementById('heroNext').addEventListener('click', function () { show(i + 1); restart(); });
      dots.forEach(function (d) {
        d.addEventListener('click', function () { show(parseInt(d.dataset.i, 10)); restart(); });
      });
      restart();
    })();
  </script>
</body>
</html>
